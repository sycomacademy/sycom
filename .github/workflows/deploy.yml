name: Deploy apps

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - "infra/**"
      - ".github/workflows/infra.yml"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-apps:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-apps-production
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Azure resource names
        run: |
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          ACR_NAME="$(az acr list --resource-group "$RG" --query "[0].name" -o tsv)"
          ACR_LOGIN_SERVER="$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)"
          WEB_APP_NAME="$(az webapp list --resource-group "$RG" --query "[0].name" -o tsv)"
          CONTAINER_APP_NAME="$(az containerapp list --resource-group "$RG" --query "[0].name" -o tsv)"
          SERVER_FQDN="$(az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$RG" --query properties.configuration.ingress.fqdn -o tsv)"
          SERVER_URL="${{ vars.SERVER_URL }}"
          if [ -z "$SERVER_URL" ]; then
            SERVER_URL="https://${SERVER_FQDN}"
          fi

          {
            echo "ACR_NAME=$ACR_NAME"
            echo "ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER"
            echo "WEB_APP_NAME=$WEB_APP_NAME"
            echo "CONTAINER_APP_NAME=$CONTAINER_APP_NAME"
            echo "SERVER_URL=$SERVER_URL"
            echo "DASHBOARD_URL=${{ vars.DASHBOARD_URL }}"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build dashboard SPA
        run: bun run build --filter=dashboard
        env:
          VITE_SERVER_URL: ${{ env.SERVER_URL }}
          VITE_DASHBOARD_URL: ${{ env.DASHBOARD_URL }}
          VITE_WEBSITE_URL: ${{ vars.WEBSITE_URL }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}

      - name: Zip dashboard dist
        run: |
          cd apps/dashboard/dist
          zip -r "$GITHUB_WORKSPACE/dashboard-spa.zip" .

      - name: Deploy dashboard to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEB_APP_NAME }}
          package: dashboard-spa.zip

      - name: Build and push server image
        run: |
          IMAGE_TAG="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          az acr build \
            --registry "$ACR_NAME" \
            --image "server:${IMAGE_TAG}" \
            --file apps/server/Dockerfile \
            .
          echo "SERVER_IMAGE=$ACR_LOGIN_SERVER/server:${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Update Container App image
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "$SERVER_IMAGE"

      - name: Print URLs
        run: |
          echo "Dashboard Web App: https://${WEB_APP_NAME}.azurewebsites.net"
          echo "Dashboard URL: $DASHBOARD_URL"
          echo "API URL: $SERVER_URL"

name: Deploy apps

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - "infra/**"
      - ".github/workflows/infra.yml"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Detect changed apps
        id: changes
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "No usable previous commit (first push or manual run) — deploying both apps."
            echo "dashboard=true" >> "$GITHUB_OUTPUT"
            echo "server=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED="$(git diff --name-only "$BEFORE" "${{ github.sha }}")"
          echo "Changed files:"
          echo "$CHANGED"

          # Anything under packages/** or a root manifest can affect either
          # app's build output, so treat it as touching both. This is a
          # deliberately conservative rule: it may redeploy an app that
          # didn't strictly need it, but it never skips one that did.
          DASHBOARD=false
          SERVER=false
          if echo "$CHANGED" | grep -qE '^(apps/dashboard/|packages/|package\.json$|bun\.lock$|turbo\.json$)'; then
            DASHBOARD=true
          fi
          if echo "$CHANGED" | grep -qE '^(apps/server/|packages/|package\.json$|bun\.lock$|turbo\.json$)'; then
            SERVER=true
          fi

          echo "dashboard=$DASHBOARD" >> "$GITHUB_OUTPUT"
          echo "server=$SERVER" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        if: steps.changes.outputs.dashboard == 'true' || steps.changes.outputs.server == 'true'
        with:
          bun-version: 1.3.12

      - name: Azure login
        if: steps.changes.outputs.dashboard == 'true' || steps.changes.outputs.server == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Azure resource names
        if: steps.changes.outputs.dashboard == 'true' || steps.changes.outputs.server == 'true'
        run: |
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          # Resolve the registry from what the server app actually pulls
          # from, not `az acr list --query [0]` — this resource group has
          # more than one ACR, and picking by index once pushed an image
          # to a registry the Container App has no pull credentials for.
          ACR_LOGIN_SERVER="$(az containerapp show --name "${{ vars.SERVER_APP_NAME }}" --resource-group "$RG" --query "properties.configuration.registries[0].server" -o tsv)"
          ACR_NAME="${ACR_LOGIN_SERVER%%.azurecr.io}"
          SERVER_FQDN="$(az containerapp show --name "${{ vars.SERVER_APP_NAME }}" --resource-group "$RG" --query properties.configuration.ingress.fqdn -o tsv)"
          SERVER_URL="${{ vars.SERVER_URL }}"
          if [ -z "$SERVER_URL" ]; then
            SERVER_URL="https://${SERVER_FQDN}"
          fi

          {
            echo "ACR_NAME=$ACR_NAME"
            echo "ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER"
            echo "SERVER_URL=$SERVER_URL"
            echo "DASHBOARD_URL=${{ vars.DASHBOARD_URL }}"
          } >> "$GITHUB_ENV"

      # --- Dashboard ---------------------------------------------------

      - name: Build and push dashboard image
        if: steps.changes.outputs.dashboard == 'true'
        run: |
          IMAGE_TAG="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          az acr build \
            --registry "$ACR_NAME" \
            --image "dashboard:${IMAGE_TAG}" \
            --file apps/dashboard/Dockerfile \
            --build-arg "VITE_SERVER_URL=$SERVER_URL" \
            --build-arg "VITE_DASHBOARD_URL=$DASHBOARD_URL" \
            --build-arg "VITE_WEBSITE_URL=${{ vars.WEBSITE_URL }}" \
            --build-arg "VITE_CLOUDINARY_CLOUD_NAME=${{ vars.CLOUDINARY_CLOUD_NAME }}" \
            .
          echo "DASHBOARD_IMAGE=$ACR_LOGIN_SERVER/dashboard:${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Deploy dashboard
        if: steps.changes.outputs.dashboard == 'true'
        run: |
          az containerapp update \
            --name "${{ vars.DASHBOARD_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "$DASHBOARD_IMAGE"

      # --- Server + migrations ------------------------------------------

      - name: Build and push server image
        if: steps.changes.outputs.server == 'true'
        run: |
          IMAGE_TAG="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          az acr build \
            --registry "$ACR_NAME" \
            --image "server:${IMAGE_TAG}" \
            --file apps/server/Dockerfile \
            .
          echo "SERVER_IMAGE=$ACR_LOGIN_SERVER/server:${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Run database migrations
        if: steps.changes.outputs.server == 'true'
        run: |
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          JOB="${{ vars.MIGRATE_JOB_NAME }}"

          az containerapp job update --name "$JOB" --resource-group "$RG" --image "$SERVER_IMAGE"

          EXECUTION_NAME="$(az containerapp job start --name "$JOB" --resource-group "$RG" --query name -o tsv)"
          echo "Started migration job execution: $EXECUTION_NAME"

          for _ in $(seq 1 60); do
            STATUS="$(az containerapp job execution show --name "$JOB" --resource-group "$RG" --job-execution-name "$EXECUTION_NAME" --query properties.status -o tsv)"
            echo "Migration status: $STATUS"
            case "$STATUS" in
              Succeeded) exit 0 ;;
              Failed|Stopped)
                echo "::error::Database migration failed. Check logs: az containerapp job logs show --name $JOB --resource-group $RG"
                exit 1
                ;;
            esac
            sleep 10
          done

          echo "::error::Timed out waiting for the migration job to finish."
          exit 1

      - name: Deploy server
        if: steps.changes.outputs.server == 'true'
        run: |
          az containerapp update \
            --name "${{ vars.SERVER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "$SERVER_IMAGE"

      - name: Summary
        run: |
          echo "Dashboard changed: ${{ steps.changes.outputs.dashboard }}"
          echo "Server changed: ${{ steps.changes.outputs.server }}"
          echo "Dashboard URL: ${{ vars.DASHBOARD_URL }}"

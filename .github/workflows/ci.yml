name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: "1"
      VITE_SERVER_URL: "https://ci.example.com"
      VITE_DASHBOARD_URL: "https://ci.example.com"
      VITE_WEBSITE_URL: "https://ci.example.com"
      VITE_CLOUDINARY_CLOUD_NAME: "ci"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run oxlint

      - name: Type check
        run: bun run check-types

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: "1"
      VITE_SERVER_URL: "https://ci.example.com"
      VITE_DASHBOARD_URL: "https://ci.example.com"
      VITE_WEBSITE_URL: "https://ci.example.com"
      VITE_CLOUDINARY_CLOUD_NAME: "ci"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run oxlint

      - name: Type check
        run: bun run check-types

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Informational only — not a required status check, so it never blocks
      # a merge. There's a large pre-existing backlog of transitive-dependency
      # advisories; this is here for visibility while that backlog gets
      # triaged, not to gate PRs on debt they didn't introduce.
      - name: Dependency audit
        if: always()
        run: |
          bun audit --json > audit.json 2>/dev/null || true
          {
            echo "## Dependency audit"
            echo
            bun -e '
              const data = JSON.parse(require("fs").readFileSync("audit.json", "utf-8"));
              const counts = { critical: 0, high: 0, moderate: 0, low: 0 };
              for (const advisories of Object.values(data)) {
                for (const a of advisories) counts[a.severity]++;
              }
              const total = Object.values(counts).reduce((a, b) => a + b, 0);
              if (total === 0) {
                console.log("No known vulnerabilities.");
              } else {
                console.log(`${total} advisories: ${counts.critical} critical, ${counts.high} high, ${counts.moderate} moderate, ${counts.low} low`);
                console.log();
                console.log("Run `bun audit` locally for details, or see the weekly dependency-update job.");
              }
            ' || echo "Could not parse audit output — see raw job log."
          } >> "$GITHUB_STEP_SUMMARY"
